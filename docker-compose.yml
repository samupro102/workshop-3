services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: happiness-streaming-broker
    user: root
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  postgres:
    image: postgres:16
    container_name: happiness-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  kafka_data:
  postgres_data: